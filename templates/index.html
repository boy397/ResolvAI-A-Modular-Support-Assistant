<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResolvAI — Support Agent Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 90px; font-size: 15px; padding: 8px; }
    button { padding: 8px 16px; margin-top: 8px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; border-radius: 6px; }
    .escalate { color: #b00020; font-weight: bold; }
    .auto_handle { color: #146c2e; font-weight: bold; }
  </style>
</head>
<body>
  <h2>ResolvAI Support Agent — Demo</h2>
  <textarea id="message" placeholder="Type a customer message..."></textarea><br>
  <button onclick="send()">Send</button>
  <div id="result"></div>

  <script>
    async function send() {
      const message = document.getElementById('message').value;
      document.getElementById('result').innerHTML = "Loading...";
      const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      if (data.error) {
        document.getElementById('result').innerHTML = `<pre>${data.error}</pre>`;
        return;
      }
      const actionClass = data.decision.action;
      document.getElementById('result').innerHTML = `
        <p><b>Intent:</b> ${data.intent} (confidence ${data.intent_confidence.toFixed(2)})</p>
        <p><b>Decision:</b> <span class="${actionClass}">${data.decision.action}</span> — ${data.decision.reason}</p>
        <p><b>Reply:</b></p>
        <pre>${data.reply}</pre>
      `;
    }
  </script>
</body>
</html>
