random_state: 42

intent_discovery:
  cluster_sample_size: 500
  n_clusters: 10

classification:
  # kept modest on purpose -- with retry/backoff + throttling in llm_client.py this
  # still takes a few minutes on a free-tier API. Raise it once you've confirmed
  # a full run completes without hitting persistent rate limits.
  label_sample_size: 250

retrieval:
  top_k_retrieval: 3

escalation:
  confidence_threshold: 0.70
  similarity_threshold: 0.35
  risk_keywords:
    - "lawsuit"
    - "lawyer"
    - "sue"
    - "fraud"
    - "chargeback"
    - "injury"
    - "legal action"
    - "scam"
    - "unauthorized charge"

golden_set:
  golden_set_size: 150
  judge_calibration_size: 35

llm:
  # "local" runs a small instruct model on-device (transformers, CPU) -- no API key,
  # no rate limit, no cost. This is the default so free-tier 429s from Groq/Gemini
  # never happen. Switch to "groq"/"gemini" (+ matching *_API_KEY in .env) if you'd
  # rather use a hosted model and are fine with their free-tier limits.
  provider: local
  model: Qwen/Qwen2.5-0.5B-Instruct   # ~1GB, CPU-friendly; downloaded once and cached by HF
